  <path d="M139 72 Q141 62 132 59 Q123 57 121 64 Q120 71 127 74 Q134 77 139 72 Z" fill="#f2c94c" stroke="#1a1626" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M101 72 Q99 62 108 59 Q117 57 119 64 Q120 71 113 74 Q106 77 101 72 Z" fill="#f2c94c" stroke="#1a1626" stroke-width="2.5" stroke-linejoin="round"/>
