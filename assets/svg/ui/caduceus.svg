  <path d="M50 66 Q38 70 30 76 Q52 84 72 80 Q94 76 108 64 L106 60 Q84 74 64 74 Q56 72 50 66 Z" fill="#d4a017"/>
  <path d="M152 52 Q170 42 192 40 M156 62 Q176 58 196 54" fill="none" stroke="#1a1626" stroke-width="1.5" opacity="0.45"/>
  <path d="M88 52 Q70 42 48 40 M84 62 Q64 58 44 54" fill="none" stroke="#1a1626" stroke-width="1.5" opacity="0.45"/>
