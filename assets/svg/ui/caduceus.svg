  <rect x="115" y="42" width="10" height="182" fill="#f2c94c" stroke="#1a1626" stroke-width="2.5"/>
  <rect x="121" y="44" width="3" height="178" fill="#d4a017"/>
  <rect x="110" y="46" width="20" height="7" rx="2" fill="#f2c94c" stroke="#1a1626" stroke-width="2"/>
  <!-- orb -->
  <circle cx="120" cy="32" r="13" fill="#f2c94c" stroke="#1a1626" stroke-width="2.5"/>
  <path d="M108.5 38 A 13 13 0 0 0 131.5 38 Q 120 46 108.5 38 Z" fill="#d4a017"/>
  <!-- ===== snake A (tail bottom-left; under B at y182/y98, over B at y140) ===== -->
