        fill="none" stroke="#1a1626" stroke-width="13" stroke-linecap="round"/>
  <path d="M72 218 C84 214 106 196 120 182 C134 175 154 172 154 161 C154 150 134 147 120 140 C106 133 86 130 86 119 C86 108 106 105 120 98 C134 91 146 92 146 84 C146 78 140 74 132 72"
        fill="none" stroke="#f2c94c" stroke-width="9" stroke-linecap="round"/>
  <path d="M72 218 C84 214 106 196 120 182 C134 175 154 172 154 161 C154 150 134 147 120 140 C106 133 86 130 86 119 C86 108 106 105 120 98 C134 91 146 92 146 84 C146 78 140 74 132 72"
        fill="none" stroke="#d4a017" stroke-width="8" stroke-linecap="butt" stroke-dasharray="3 11" opacity="0.85"/>
  <!-- ===== snake B (tail bottom-right; crosses over A at y182 and y98) ===== -->
  <path d="M168 218 C156 214 134 196 120 182 C106 175 86 172 86 161 C86 150 106 147 120 140 C134 133 154 130 154 119 C154 108 134 105 120 98 C106 91 94 92 94 84 C94 78 100 74 108 72"
        fill="none" stroke="#1a1626" stroke-width="13" stroke-linecap="round"/>
  <path d="M168 218 C156 214 134 196 120 182 C106 175 86 172 86 161 C86 150 106 147 120 140 C134 133 154 130 154 119 C154 108 134 105 120 98 C106 91 94 92 94 84 C94 78 100 74 108 72"
