  <circle cx="110" cy="65" r="1.8" fill="#1a1626"/>
  <path d="M123 61 L121 54 L119 57 M117 61 L119 54" fill="none" stroke="#1a1626" stroke-width="1.5" stroke-linecap="round"/>
</svg>
