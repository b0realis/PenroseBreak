<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- PRESCRIPTION GAMES brand mark: gold caduceus — winged staff, two entwined snakes crossing
       three times (weave alternates B/A/B). Flat gold #f2c94c / #d4a017, #1a1626 outlines,
       transparent background. Reads at 96 px, crisp at 300 px. -->
  <!-- ===== wings (behind staff) ===== -->
  <path d="M130 66 Q148 38 186 32 Q216 28 232 36 Q214 44 198 50 Q216 50 228 56 Q208 64 190 66 Q202 70 210 76 Q188 84 168 80 Q146 76 132 64 Z"
        fill="#f2c94c" stroke="#1a1626" stroke-width="2.5" stroke-linejoin="round"/>
